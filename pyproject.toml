[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carmel"
dynamic = ["version"]
description = "Closed-loop campaign manager for predictive chemical kinetics"
license = {text = "Apache-2.0"}
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0",
    "numpy>=2.1",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "mkdocs-material>=9.0",
]
# pydantic-ai floor raised from the old >=0.0.20 to >=2.0: the pre-2.0 releases
# predate the current provider/model/usage APIs `carmel/agents/models.py` calls
# (e.g. the `input_tokens`/`output_tokens` usage attribute names -- the
# `request_tokens`/`response_tokens` fallback in `_read_usage_token_count` exists
# ONLY to cover installs pinned below 2.0 by a dependency solver quirk, not as a
# supported floor). >=0.0.20 admitted versions that would import fine and then
# fail at call time on a missing attribute, which is a worse failure mode than a
# resolver conflict at install time.
#
# genai_prices is declared explicitly (it is pydantic-ai's own live-pricing
# dependency, already pulled in transitively) so the version Carmel's fallback
# pricing table in `models.py` was cross-checked against
# (see `_MODEL_PRICING_USD_PER_1M_TOKENS`'s verified-on comment) is pinned rather
# than left to whatever pydantic-ai happens to require.
#
# pypdf is pinned EXACTLY, and a range here would be a comment that promises more than it
# delivers. `_is_current` compares the recorded `pypdf_version` STRING for equality (see
# `_PYPDF_DEPENDENT_EXTRACTORS` and `_build_identity_payload`), so the version is not
# bounded by this constraint -- it is part of the content address of every `pdf:pypdf`
# extraction record. ANY resolved version other than the one that wrote the store, patch
# releases included, makes every such record non-current at once, and the campaign then
# refuses each affected document until `Carmel.py reextract --apply` has run.
#
# A range cannot express that invariant. `>=6.0,<7` is only a major-version fence: it still
# lets a fresh `pip install` land 6.15 and orphan a working store behind the operator's
# back, which is the exact failure this constraint exists to prevent. (An earlier `>=5.0,<6`
# was worse still -- aimed backwards, it would have installed 5.x when every record in the
# live workspace was written by 6.14.2.)
#
# Bumping pypdf is therefore a deliberate act with a re-extraction pass attached: change the
# pin here, then run `Carmel.py reextract --apply` against each workspace. An install-time
# resolver conflict is the intended failure mode; a silently invalidated evidence store is
# not.
agents = ["pydantic-ai>=2.0", "genai-prices>=0.0.70", "pypdf==6.14.2", "rdkit>=2024.3"]

[project.scripts]
carmel = "Carmel:cli"

[tool.setuptools.dynamic]
version = {attr = "carmel.version.__version__"}

[tool.setuptools]
py-modules = ["Carmel"]

[tool.setuptools.packages.find]
include = ["carmel*"]

[tool.setuptools.package-data]
"carmel.ui" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "tests/fixtures/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
# No target-version here on purpose: ruff derives it from
# project.requires-python, which is the single source of truth for the
# Python floor. Restating the floor is exactly how these two silently
# drifted two minor versions apart.
line-length = 120
# "probes" is a local-only scratch directory (git-excluded, never committed) holding the
# measurement instruments used to decide what this parser may honestly claim. Excluded so
# `ruff format` cannot rewrite an instrument mid-measurement, and so a developer who has
# one checked out does not get a permanently red `make lint`.
extend-exclude = ["tests/fixtures", "probes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
# Must match project.requires-python above; mypy has no way to derive it.
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
