name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two CI lanes:
#
#   1. REQUIRED LANE — `lint` + `test` jobs.
#      Pure-Python, fast, no external chemistry stack. Must pass for merge.
#
#   2. BEST-EFFORT LANE — `tools` job.
#      Installs the full RMG-Py / RMG-database / ARC / T3 stack via conda
#      and exercises the real T3 subprocess path. The whole job carries
#      `continue-on-error: true` at the job level, so a collapse anywhere
#      in the heavy install chain cannot redden the required lanes above.
#      Currently best-effort because of one specific upstream blocker:
#
#        ARC's arc/main.py imports `from distutils.spawn import find_executable`
#        which was removed from the Python standard library in 3.12.
#        Until that is migrated upstream (e.g. to `shutil.which`), T3
#        cannot be imported on Python 3.12 even when the package is on
#        sys.path. The `tests/test_t3_adapter.py::TestT3AdapterRealSubprocess`
#        suite is gated on the stricter `is_t3_importable()` probe so it
#        skips cleanly until that lands.
#
#      The "Probe T3 importability" step is the one diagnostic that
#      reveals whether the upstream blocker is still in effect: it prints
#      the result and only fails on an unexpected error (e.g. Carmel
#      itself failing to import), not on a clean "not importable" answer.
#
#      Once ARC ships the fix, the `tools` job becomes required and
#      `continue-on-error: true` should be removed from the job.
#
#      The upstream stack is cloned at the top of the job so its commit
#      SHAs can key three caches: conda's package tarballs, the solved
#      conda environment, and RMG-Py's compiled Cython extensions. Those
#      SHAs — not Carmel's own environment.yml — are what determine
#      whether a cached environment is still valid, because they are what
#      actually gets installed. Anything whose cache hit SKIPS a build
#      step is keyed on an exact match with no restore-keys; see the
#      comments on the individual cache steps for why.

jobs:
  lint:
    name: Lint + format + typecheck (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install

      - name: Lint and format check
        run: make lint

      - name: Type check
        run: make typecheck

  test:
    name: Tests + packaging smoke (required)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install

      - name: Run tests with coverage
        run: pytest --cov --cov-branch --cov-report=term-missing --cov-report=xml

      # Builds a wheel, installs it into a clean venv, and exercises it from a
      # neutral working directory. An editable install run from the repo root
      # cannot catch packaging faults: the repo root is on sys.path, so a
      # module missing from the distribution (or a template/static asset that
      # was never packaged) still resolves and the smoke test passes.
      - name: Packaging smoke — wheel install, console script, and Flask app boot
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/carmel" version
          "$RUNNER_TEMP/smoke/bin/carmel" --help
          "$RUNNER_TEMP/smoke/bin/carmel" serve --help
          "$RUNNER_TEMP/smoke/bin/python" -c "from carmel.ui import create_app; app = create_app(); client = app.test_client(); r = client.get('/'); assert r.status_code == 200, f'expected 200, got {r.status_code}'; assert client.get('/static/style.css').status_code == 200, 'static assets missing from the wheel'; print('Flask app boot ok')"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  tools:
    name: Real T3/ARC/RMG (best-effort, blocked on ARC distutils)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash -el {0}
    env:
      # conda's package cache. This has to be set explicitly: the default lives
      # inside the miniconda installation, which actions/cache cannot restore
      # into before setup-miniconda has run.
      CONDA_PKGS_DIRS: /home/runner/conda_pkgs_dir
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Cloned BEFORE the conda setup so the upstream commit SHAs are available
      # to key the caches below. The upstream stack is what actually gets
      # installed, so the caches must be keyed on those revisions — not on
      # Carmel's own environment.yml, which describes a different environment
      # entirely and never changes when RMG/ARC/T3 do.
      - name: Clone the upstream chemistry stack
        run: |
          git clone --depth 1 https://github.com/ReactionMechanismGenerator/RMG-Py.git "$HOME/RMG-Py"
          git clone --depth 1 https://github.com/ReactionMechanismGenerator/RMG-database.git "$HOME/RMG-database"
          git clone --depth 1 https://github.com/ReactionMechanismGenerator/ARC.git "$HOME/ARC"
          git clone --depth 1 https://github.com/ReactionMechanismGenerator/T3.git "$HOME/T3"

      - name: Pin the upstream revisions for the cache keys
        id: pins
        run: |
          for repo in RMG-Py RMG-database ARC T3; do
            printf '%s %s\n' "$repo" "$(git -C "$HOME/$repo" rev-parse HEAD)"
          done | tee "$HOME/upstream-pins.txt"
          echo "stack=$(sha256sum "$HOME/upstream-pins.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "rmgpy=$(git -C "$HOME/RMG-Py" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167  # v3.3.0
        with:
          python-version: "3.12"
          miniforge-version: latest
          activate-environment: rmg_env
          channels: conda-forge,defaults

      # actions/cache needs a concrete path at step level, but $CONDA_PREFIX is
      # only known once the environment is activated — so publish it through
      # $GITHUB_ENV. Note this is the ONLY way ${{ env.X }} ever resolves: the
      # env context sees vars from env: blocks and $GITHUB_ENV, never the
      # runner's own shell environment. (${{ env.HOME }} silently expands to
      # the empty string, which is why $HOME is used inside run: below.)
      - name: Record the conda environment prefix
        run: echo "ENV_PREFIX=$CONDA_PREFIX" >> "$GITHUB_ENV"

      # Package tarballs. Safe to reuse across upstream revisions — conda
      # validates every package against the solve before using it — so this
      # entry takes restore-keys and degrades gracefully to a partial hit,
      # which still saves most of the download time on a cache miss.
      - name: Cache conda packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ env.CONDA_PKGS_DIRS }}
          key: ${{ runner.os }}-conda-pkgs-${{ steps.pins.outputs.stack }}
          restore-keys: |
            ${{ runner.os }}-conda-pkgs-

      # The solved environment itself — the expensive artifact. Deliberately NO
      # restore-keys here: the install steps below are skipped on a hit, so a
      # near-miss would silently test a stack built from different upstream
      # revisions than the ones just checked out. An exact-match-or-rebuild
      # policy is the only honest one when a hit suppresses the build.
      - name: Cache the solved conda environment
        id: cache-env
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ env.ENV_PREFIX }}
          key: ${{ runner.os }}-rmg-env-py3.12-${{ steps.pins.outputs.stack }}

      # RMG-Py's compiled Cython extensions land in the source tree rather than
      # the conda env, so they need their own entry — keyed on RMG-Py alone,
      # since a change to ARC or T3 does not invalidate them.
      - name: Cache the compiled RMG-Py tree
        id: cache-rmgpy
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/RMG-Py/build
            ~/RMG-Py/**/*.so
          key: ${{ runner.os }}-rmgpy-build-${{ steps.pins.outputs.rmgpy }}

      # The job carries `continue-on-error: true` so a collapse anywhere in
      # this heavy install chain (flaky upstream conda environment, large
      # chemistry stack, or a corrupt restored cache) cannot redden the
      # required lanes above.
      - name: Install RMG-Py environment
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/RMG-Py"
          conda env update -n rmg_env -f environment.yml

      - name: Install ARC dependencies
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/ARC"
          if [ -f environment.yml ]; then conda env update -n rmg_env -f environment.yml; fi
          pip install -e .

      - name: Install T3 dependencies
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/T3"
          if [ -f environment.yml ]; then conda env update -n rmg_env -f environment.yml; fi
          pip install -e .

      - name: Build RMG-Py
        if: steps.cache-rmgpy.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/RMG-Py"
          make

      # Restoring a conda env by copying its directory is a pragmatic trick,
      # not a supported conda operation. This step is the tripwire: if the
      # restored env is subtly broken, fail here with a clear message rather
      # than let a mangled interpreter masquerade as a real test result.
      # It deliberately checks only the conda env itself — not the upstream
      # packages, which are not on sys.path until "Set RMG paths" below and
      # which have their own known import blocker (see the header comment).
      - name: Verify the restored conda environment is usable
        run: |
          python -c "import sys, numpy, yaml; print('conda env ok:', sys.version)" || {
            echo "::error::Restored conda environment is unusable. Bump the cache key or clear the caches."
            exit 1
          }

      - name: Set RMG paths
        run: |
          echo "PYTHONPATH=$HOME/RMG-Py:$HOME/ARC:$HOME/T3:$PYTHONPATH" >> $GITHUB_ENV
          echo "rmgpy_path=$HOME/RMG-Py" >> $GITHUB_ENV
          echo "T3_PATH=$HOME/T3" >> $GITHUB_ENV

      - name: Install Carmel
        run: pip install -e ".[dev]"

      # This probe is the one diagnostic that reveals whether the upstream
      # ARC/distutils blocker is still in effect, so it must NOT be
      # swallowed by continue-on-error. It exits 0 on a clean "importable"
      # or "not importable" answer either way, and only fails on an
      # unexpected error (e.g. Carmel itself failing to import).
      - name: Probe T3 importability
        run: |
          python -c "
          try:
              from carmel.adapters.t3 import is_t3_importable
              print('T3 importable:', is_t3_importable())
          except Exception as exc:
              print(f'Unexpected error probing T3 importability: {exc!r}')
              raise
          "

      # The test step itself relies on the job-level continue-on-error, not
      # a step-level one: if T3 is importable then the real subprocess test
      # must pass and its failure must be visible. If T3 is not importable,
      # the @requires_t3 marker skips it cleanly and pytest exits 0.
      - name: Run T3-dependent tests
        run: pytest tests/test_t3_adapter.py -v
