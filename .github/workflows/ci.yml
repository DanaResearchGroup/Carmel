name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request makes the in-flight run obsolete, so cancel it
# rather than let it hold a runner. Never cancel on main: those runs are the
# record of what the branch actually did.
#
# The heavy chemistry-stack lane lives in tools.yml, NOT here, precisely so it
# is not subject to this rule — cancelling it part-way discards both the work
# and the caches it would have written.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The REQUIRED lane: `lint` + `test`. Pure-Python, fast, no external chemistry
# stack. Must pass for merge. The best-effort lane that builds the real
# RMG/ARC/T3 stack is a separate workflow, tools.yml.

jobs:
  # NOTE: this job's `name:` says "typecheck" but no longer runs it -- that
  # name is a literal required status-check context in the repo's "Protect
  # Main" ruleset (see `gh api repos/DanaResearchGroup/Carmel/rulesets`), so
  # renaming it would silently stop satisfying branch protection for every
  # future PR. Left as-is deliberately; do not rename without first updating
  # the ruleset.
  #
  # Why typecheck moved out of this job: `carmel/services/chem.py`,
  # `carmel/agents/tools/extract.py`, `carmel/agents/models.py` import the
  # optional `rdkit`/`pypdf`/`pydantic-ai`/`genai-prices` dependencies, which
  # this job's `make install-dev` deliberately does NOT install (see
  # `install-dev`'s comment in the Makefile). Running mypy here without those
  # packages produces `import-not-found` errors that are real once, but the
  # inverse also happens: `chem.py`'s `# type: ignore[no-untyped-call]` on
  # `Chem.MolToInchiKey` is REQUIRED once `rdkit-stubs` is installed (that
  # stub leaves the function unannotated), yet flagged `unused-ignore` when
  # rdkit is absent, because `strict = true` turns on
  # `warn_unused_ignores`. No single mypy invocation satisfies both
  # environments, and weakening strictness (blanket `ignore_missing_imports`,
  # `warn_unused_ignores = false`) is not acceptable. So the agents-installed
  # environment is the one supported mypy target; the `agents` job below
  # (its display name says "(required)") owns typecheck there.
  #
  # ENFORCEMENT (verified 2026-08-12; this WAS a real gap when first written):
  # the `agents` job IS now listed in the repo's "Protect Main" ruleset, so a
  # red mypy result here genuinely blocks a merge. The five required contexts
  # are `Lint + format + typecheck (required)`,
  # `Tests + packaging smoke (required) (3.14)`, `Check CLA signature`,
  # `build`, and `Agents extra -- tests + typecheck (required)`.
  #
  # Re-check with `gh api repos/DanaResearchGroup/Carmel/rulesets/14702943`
  # (-> rules[].parameters.required_status_checks) rather than trusting this
  # comment. The paragraph that used to sit here stayed stale after the gap
  # was closed, and an adversarial review then took it at face value and
  # reported the merge gate as weaker than it actually is. A stale claim about
  # enforcement is worse than no claim: depending on which way it has rotted it
  # produces either false alarm or misplaced confidence.
  #
  # NOTE: the ruleset matches on the display-name context string, so RENAMING
  # a job silently drops it from the required set.
  lint:
    name: Lint + format + typecheck (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: make install-dev

      - name: Lint and format check
        run: make lint

  test:
    name: Tests + packaging smoke (required)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what crml_env resolves to and what T3 and ARC require, so it
        # is the only python Carmel actually runs on. requires-python is set to
        # match, rather than advertising a 3.12 floor nothing verifies.
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: make install-dev

      # No coverage FLOOR here, on purpose: this job installs no `agents` extra, so
      # every pypdf/pydantic-ai/rdkit-dependent module is unreachable by construction
      # and its statements count as misses. `pdf_fragments.py` alone runs at 17% (430
      # of 568 statements), which is ~3.1% of the 13749-statement total -- more than
      # the whole shortfall that was failing this job at 87.15% against a floor of 90.
      # The number measured what was INSTALLED, not what was tested. The floor lives
      # in the `agents` job below, where the whole codebase is actually executable;
      # this job still runs every test and still fails on any real failure.
      - name: Run tests with coverage (no floor — see the agents job)
        run: pytest --cov --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=0

      # Builds a wheel, installs it into a clean venv, and exercises it from a
      # neutral working directory. An editable install run from the repo root
      # cannot catch packaging faults: the repo root is on sys.path, so a
      # module missing from the distribution (or a template/static asset that
      # was never packaged) still resolves and the smoke test passes.
      - name: Packaging smoke — wheel install, console script, and Flask app boot
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/carmel" version
          "$RUNNER_TEMP/smoke/bin/carmel" --help
          "$RUNNER_TEMP/smoke/bin/carmel" serve --help
          "$RUNNER_TEMP/smoke/bin/python" -c "from carmel.ui import create_app; app = create_app(); client = app.test_client(); r = client.get('/'); assert r.status_code == 200, f'expected 200, got {r.status_code}'; assert client.get('/static/style.css').status_code == 200, 'static assets missing from the wheel'; print('Flask app boot ok')"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  agents:
    name: Agents extra — tests + typecheck (required)
    runs-on: ubuntu-latest
    # Deliberately NO provider secrets in `env:` here, and none referenced below.
    # Every agents-path test uses `MockModel`/`MockFetchTool`/an injected fake
    # opener (see tests/test_bridge.py, tests/test_fetch.py) rather than a real
    # provider call, so this lane needs no `GOOGLE_API_KEY` or similar to pass.
    # If a future test ever required a real key to go green, that would be the
    # bug to fix (add a mock), not a secret to add here — this lane must stay
    # runnable on any fork's PR without granting it any outbound credential.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The ONLY difference from the `lint`/`test` lanes above: this installs
      # the optional `agents` extra (pydantic-ai, pypdf, rdkit). Before this
      # job existed, NOTHING in CI ever installed that extra, so every test
      # gated on `pytest.importorskip("pydantic_ai" | "pypdf" | "rdkit")` in
      # tests/test_bridge.py, tests/test_extract.py and tests/test_chem.py
      # silently skipped in the required lane — the LLM/PDF/RDKit code path
      # was untested in CI, and both the green checkmark and the coverage
      # percentage reported on those files were misleading. This job exists
      # so that stops being true.
      - name: Install dependencies (including the agents extra)
        run: make install-agents-dev

      # Same command the `lint` job runs, but in an environment where
      # pydantic-ai/pypdf/rdkit are actually importable. mypy resolves stubs
      # and attribute types differently once those packages are on the path
      # (e.g. rdkit ships its own `rdkit-stubs`), so a lane that never installs
      # them can report a clean typecheck while missing real errors that only
      # surface here.
      - name: Type check (agents extra installed)
        run: make typecheck

      # This job carries the coverage FLOOR for the whole repo, because it is the only
      # one where every module is reachable: `pyproject.toml`'s `fail_under = 90`
      # applies here and is explicitly disabled in the base job above. Stated on the
      # command line as well as inherited, so that lowering the shared config cannot
      # quietly lower the gate that is actually enforced.
      - name: Run tests with coverage (agents extra installed — carries the 90% floor)
        run: pytest --cov --cov-branch --cov-report=term-missing --cov-fail-under=90 --junitxml=agents-report.xml

      # The whole point of this job is that the agents-path tests actually RUN
      # rather than skip — mirroring the "must not skip" gates in tools.yml for
      # the real T3/ARC subprocess tests. Without this check, a future
      # regression that broke pydantic-ai/pypdf/rdkit importability (or a typo
      # that renamed one of the `importorskip` targets) would make every
      # gated test skip again, the pytest step would still exit 0, and this
      # job would report green having tested nothing — exactly the failure
      # mode this job exists to close.
      - name: Require that the agents-extra tests actually ran (did not skip)
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          report = pathlib.Path("agents-report.xml")
          if not report.is_file():
              sys.exit("::error::no pytest report; the agents test step never ran.")

          # pytest's JUnit XML has no reliable per-file attribute, only
          # `classname` (dotted module path + class, e.g.
          # "tests.test_bridge.TestCarmelAgentRun") -- so match on that.
          # One representative module per optional package, named explicitly
          # (rather than "any test anywhere") so a rename or reshuffle fails
          # loudly here instead of silently narrowing what this gate checks.
          required_modules = [
              "test_bridge",
              "test_extract",
              "test_chem",
              # The literature/dataset lane. These modules build REAL pypdf
              # extraction records, so without the extra they skip wholesale via
              # tests/pypdf_gate.py -- 165 tests that would otherwise have gone
              # green-by-skipping here while the base job was red.
              "test_dataset_producer",
              "test_dataset_replay",
              "test_condition_set_producer",
          ]
          root = ET.parse(report).getroot()
          cases = list(root.iter("testcase"))
          if not cases:
              sys.exit("::error::the agents test report contains no test cases at all.")

          seen_modules: set[str] = set()
          skipped_of_interest: list[str] = []
          for case in cases:
              classname = case.get("classname", "")
              for module in required_modules:
                  if f".{module}." in classname:
                      seen_modules.add(module)
                      if case.find("skipped") is not None:
                          skipped_of_interest.append(f"{classname}::{case.get('name')}")

          missing = [module for module in required_modules if module not in seen_modules]
          if missing:
              sys.exit(
                  f"::error::no test cases found in module(s) {missing!r}; "
                  "the agents-path tests may have been renamed or removed."
              )

          # A handful of unrelated tests may legitimately skip for other
          # reasons; what this gate forbids is a
          # `pytest.importorskip("pydantic_ai" | "pypdf" | "rdkit")` -- or a
          # `tests/pypdf_gate.require_pypdf()` -- firing inside these modules,
          # which only happens if the agents extra failed to install or import.
          if skipped_of_interest:
              sys.exit(
                  "::error::agents-path test(s) skipped even with the agents extra "
                  f"installed -- pydantic-ai/pypdf/rdkit import must have failed: {skipped_of_interest!r}"
              )
          print(f"agents-extra tests present in {sorted(seen_modules)!r} and none skipped")
          PY
